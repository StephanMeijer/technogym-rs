# The same advisory check ci.yml runs, on a clock: an advisory is not published in
# response to activity, and a quiet repository would otherwise not look at
# Cargo.lock until somebody pushed. Gates nothing. Keep the cargo-deny version in
# step with ci.yml.
name: Advisories

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: 9xx
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-deny@0.20.2
      # The 9xx runner ships rustup with no toolchain; cargo needs one.
      - run: rustup default stable
      - run: cargo deny --locked check advisories
