name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # `toolchain` is a matrix because Cargo.toml declares a workspace `rust-version`,
  # baked into both published manifests. A declared MSRV that nothing compiles
  # against is a claim, not a fact; this leg is what makes it true. Only `test`
  # gets the matrix: rustfmt is not byte-stable across releases, and clippy's
  # pedantic group moves between releases, so a second leg there reports churn.
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      # "stable green, MSRV red" is a different diagnosis from "both red".
      fail-fast: false
      matrix:
        toolchain: [stable, "1.89"]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # `@master` because for this action the ref IS the toolchain, and the
      # matrix value has to arrive as an input, which only `master` accepts.
      # SHA-pinned because `master` moves.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master, 2026-09-12
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.toolchain }}
      - run: cargo test --workspace --locked

  clippy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Same gate as `just doc`: a public doc that links to a private item, or a broken
  # intra-doc link, fails here before it reaches docs.rs.
  doc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  # A dependency a crate declares but never names: every crate here is published,
  # so an unused entry is compiled by every downstream consumer. Renovate bumps the
  # action SHA but cannot see `tool:`, so the cargo-machete version moves by hand.
  machete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # Dry-run `cargo package`: release-plz packages each crate on its own, and a crate
  # that only compiles because a sibling switched a shared feature on is a failure
  # nothing else catches.
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo package --workspace --locked

  # Known advisories in Cargo.lock. Does NOT gate a release (nothing `needs:` it):
  # a red run here blocks no tag, it puts the finding in front of somebody. The
  # advisory database cannot be pinned; the tool and the database's source are.
  # Keep the cargo-deny version in step with advisories.yml.
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.19
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories

  # Dry-run Dockerfile build on every push and PR: catches breakage before
  # release-plz can tag a broken commit. push=false needs no login or secrets, so
  # it is safe for fork PRs.
  docker-build:
    name: Docker Build
    uses: ./.github/workflows/docker.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
      attestations: write
    with:
      push: false

  # release-plz-pr MUST `needs:` release-plz-release so the tag and the crates.io
  # publish are visible before the PR job derives the next version; and
  # release-plz-release MUST NOT have a `concurrency:` block, because GitHub
  # cancels a pending run when a newer one is queued, silently dropping a release.
  release-plz-release:
    name: Tag and publish crates
    needs: [test, clippy, fmt, docker-build]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'StephanMeijer/technogym-rs'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      # So the follow-up step can dispatch release.yml.
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # Trusted Publishing cannot create a crate: a member that has never been
      # published fails every push until someone bootstraps it (RELEASING.md).
      # A warning, never a failure: release-plz must still publish the new
      # crate's dependencies, which is what the bootstrap builds against.
      - name: Name any crate that has never been published
        run: |
          set -euo pipefail
          for crate in $(cargo metadata --format-version 1 --no-deps \
                         | jq -r '.packages[] | select(.publish == null or (.publish | length) > 0) | .name'); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                     -H 'User-Agent: technogym-rs-ci (https://github.com/StephanMeijer/technogym-rs)' \
                     "https://crates.io/api/v1/crates/${crate}" || true)
            case "${status:-000}" in
              200) ;;
              404) echo "::warning::${crate} has never been published; Trusted Publishing cannot create it, so release-plz will stop at it with a 403 once its dependencies are up. Bootstrap it with 'Publish crate (initial)'; see RELEASING.md." ;;
              *)   echo "::notice::could not check ${crate} on crates.io (HTTP ${status:-000}); continuing" ;;
            esac
          done
      - name: Run release-plz (release)
        id: release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
          config: release-plz.toml
          # Pinned because release-plz.toml's `pr_body` is a copy of this
          # version's default template. Re-sync that copy when bumping.
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # release-plz pushed the tag with GITHUB_TOKEN, and GitHub suppresses
      # `push` triggers on such tags (recursion prevention), so release.yml is
      # dispatched explicitly. The `^v[0-9]` filter picks the workspace tag.
      - name: Trigger release.yml for the workspace tag
        if: steps.release-plz.outputs.releases != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$RELEASES" | jq -r '..|.tag? // empty | select(test("^v[0-9]"))' | head -n1)
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            echo "Dispatching release.yml against tag $tag"
            gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
          else
            echo "No workspace tag (v*) in release-plz output; nothing to dispatch"
          fi
      # A publish that has returned but is not yet in the sparse index looks like
      # "nothing was released" to release-plz-pr, which would then re-propose the
      # version just published. Hold this job open until the index agrees.
      - name: Wait for crates.io to index the published version
        if: steps.release-plz.outputs.releases != ''
        timeout-minutes: 10
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          version=$(printf '%s' "$meta" | jq -er '[.packages[] | select(.publish != []) | .version] | unique | .[0]')
          crates=$(printf '%s' "$meta" | jq -er '.packages[] | select(.publish != []) | .name')
          echo "Waiting for $version to appear in the crates.io index"
          while read -r crate; do
            [ -n "$crate" ] || continue
            url="https://index.crates.io/${crate:0:2}/${crate:2:2}/${crate}"
            until curl -sfL "$url" | jq -es --arg v "$version" 'any(.[]; .vers == $v)' >/dev/null; do
              echo "  $crate $version not indexed yet; retrying in 5s"
              sleep 5
            done
            echo "  $crate $version indexed"
          done <<< "$crates"

  release-plz-pr:
    name: Open / update release PR
    needs: [test, clippy, fmt, docker-build, release-plz-release]
    # `!cancelled()` lets this run after a FAILED release too: when only a version
    # bump can make the release succeed (a new crate), the release PR is the way
    # out, and a job that waited for a green release would never open it.
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'StephanMeijer/technogym-rs'
      && contains(fromJSON('["success", "failure"]'), needs.release-plz-release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5.148
        with:
          command: release-pr
          config: release-plz.toml
          version: 0.3.169
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
