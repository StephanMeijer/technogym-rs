[package]
name = "technogym-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "MCP server for Technogym mywellness: read your gym workouts, sets and treadmill/bike analytics from Claude and other MCP clients"
readme = "README.md"
keywords = ["technogym", "mywellness", "mcp", "model-context-protocol", "claude"]
categories = ["command-line-utilities"]

[[bin]]
name = "technogym-mcp"
path = "src/main.rs"

# Sole cargo-dist opt-in: one archive per target carrying this binary.
[package.metadata.dist]
dist = true

[dependencies]
technogym.workspace = true
async-trait.workspace = true
rmcp.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "io-std", "net"] }
clap.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio-util = "0.7"
aes-gcm.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand.workspace = true
url.workspace = true
rpassword.workspace = true
dirs.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
tower = { workspace = true, features = ["util"] }
rmcp = { workspace = true, features = ["client"] }
url.workspace = true
base64.workspace = true
sha2.workspace = true

[lints]
workspace = true
