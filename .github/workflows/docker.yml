# Reusable Docker workflow.
#
#   - ci.yml calls it with `push: false`: PR/main validation, no login, no secrets.
#   - release.yml calls it with `push: true, sign: true`: tag-triggered publish to
#     ghcr.io/stephanmeijer/technogym-mcp with cosign keyless signing.
#
# A per-architecture `build` matrix on NATIVE runners, then a `merge` job that
# assembles one manifest list and signs it. Not QEMU: emulated aarch64 codegen of
# this tree takes tens of minutes, native arm runners are free for public repos.
name: Docker

on:
  workflow_call:
    inputs:
      push:
        description: "Whether to push the built image to GHCR."
        type: boolean
        default: false
      sign:
        description: "Whether to sign the pushed image with cosign (requires push=true)."
        type: boolean
        default: false
      ref:
        description: "Git ref to check out. Empty = the SHA that triggered the caller."
        type: string
        default: ""
      tag_name:
        description: "Release tag used for image tagging when push=true (e.g. v1.2.3)."
        type: string
        default: ""

env:
  IMAGE: ghcr.io/stephanmeijer/technogym-mcp

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the image version
        id: version
        env:
          PUSH: ${{ inputs.push }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${PUSH}" != "true" ]; then
            echo "version=ci-validation" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${TAG_NAME}" in
            v[0-9]*) ;;
            *)
              echo "::error::tag_name='${TAG_NAME}' is not a vX.Y.Z release tag" >&2
              exit 1
              ;;
          esac
          echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
      # push=true pushes an UNTAGGED, content-addressed manifest (push-by-digest is
      # the only way two independently built architectures end up in one tagged
      # manifest list). provenance/sbom off so each child is a plain manifest, not
      # a single-entry index; SLSA provenance is attached once, to the merged index.
      - name: Build ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: >-
            ${{ inputs.push
              && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE)
              || format('type=docker,name={0}:validation', env.IMAGE) }}
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Record the per-arch digest for the manifest merge
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          [ -n "${DIGEST}" ] || { echo "::error::build produced no digest" >&2; exit 1; }
          mkdir -p /tmp/digests /tmp/platforms
          touch "/tmp/digests/${DIGEST#sha256:}"
          echo "${PLATFORM}" > "/tmp/platforms/${PLATFORM//\//-}"
      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1
      - name: Upload the platform
        if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: platforms-${{ matrix.arch }}
          path: /tmp/platforms/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge into a multi-platform manifest
    # Skipped (not failed) on push=false, which leaves the reusable workflow green.
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      actions: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/platforms
          pattern: platforms-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and annotations
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag_name }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag_name, '-') }}
          labels: |
            org.opencontainers.image.title=technogym-mcp
            org.opencontainers.image.description=Hosted MCP server for Technogym mywellness (unofficial)
            org.opencontainers.image.source=https://github.com/StephanMeijer/technogym-rs
            org.opencontainers.image.url=https://github.com/StephanMeijer/technogym-rs
            org.opencontainers.image.licenses=MPL-2.0
      - name: Verify resolved version is non-empty
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -z "${VERSION}" ]; then
            echo "ERROR: docker/metadata-action produced empty version (tag_name=${TAG_NAME})" >&2
            exit 1
          fi
          echo "Publishing image version: ${VERSION}"
      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -er '.tags[]' <<<"$TAGS_JSON")
          mapfile -t annotations < <(printf '%s\n' "$ANNOTATIONS" | sed '/^$/d')
          # shellcheck disable=SC2046 # the digests are meant to split into one argument each
          docker buildx imagetools create \
            "${tags[@]/#/--tag=}" \
            "${annotations[@]/#/--annotation=}" \
            $(printf "${IMAGE}@sha256:%s " *)
      - name: Resolve and verify the published index
        id: index
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
                    --format '{{json .Manifest}}' | jq -er '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          platforms=$(docker buildx imagetools inspect "${IMAGE}@${digest}" \
                       --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          mapfile -t expected < <(cat /tmp/platforms/* | sed '/^$/d' | sort -u)
          [ "${#expected[@]}" -gt 0 ] || { echo "::error::no build leg recorded a platform" >&2; exit 1; }
          for want in "${expected[@]}"; do
            case " ${platforms} " in
              *" ${want} "*) ;;
              *)
                echo "::error::published index ${digest} is missing ${want} (has: ${platforms})" >&2
                exit 1
                ;;
            esac
          done
          echo "index ${digest} carries: ${platforms}"
      - name: Install Cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v2.4.0"
      # Sign the manifest LIST (what a tag resolves to) and, with --recursive,
      # every child, for admission controllers that verify a platform digest.
      - name: Sign the manifest list and its children (keyless via Sigstore/Fulcio)
        if: inputs.sign
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
      - name: Generate SLSA provenance attestation for the image
        if: inputs.sign
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
