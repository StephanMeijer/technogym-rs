[workspace]
resolver = "2"
members = ["crates/technogym", "crates/technogym-mcp"]

[workspace.package]
version = "0.1.1"
edition = "2024"
# The floor of the resolved dependency graph (uuid 1.29 via rmcp asks for 1.89), checked by
# ci.yml's MSRV test leg. A fact about today's tree, not a support promise.
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/StephanMeijer/technogym-rs"
homepage = "https://github.com/StephanMeijer/technogym-rs"
authors = ["Stephan Meijer <me@stephanmeijer.com>"]

[workspace.dependencies]
technogym = { path = "crates/technogym", version = "0.1.1" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"

# MCP server
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "schemars", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "form", "json", "query"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
aes-gcm = "0.11"
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
rand = "0.10"
url = "2"
rpassword = "7"
dirs = "7"

# Testing
wiremock = "0.6"

# cargo-dist: only technogym-mcp opts in ([package.metadata.dist] dist = true).
[workspace.metadata.dist]
cargo-dist-version = "0.34.0"
allow-dirty = ["ci"]
ci = ["github"]
# No Windows targets: `ring`'s C build fails under cargo-xwin; Windows users
# `cargo install technogym-mcp`.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
installers = ["shell"]
unix-archive = ".tar.xz"
checksum = "sha256"
build-local-artifacts = true
publish-prereleases = false
announce-in-tag = true

[workspace.lints.rust]
unsafe_code = "forbid"
dead_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Reason: `data`/`date`, `session`/`sessions` are the domain's words.
similar_names = "allow"
# Reason: the API's own flags; a struct mirroring a payload has as many bools as the payload.
struct_excessive_bools = "allow"
# Reason: builder setters.
return_self_not_must_use = "allow"
# Reason: the only panics are poisoned mutexes.
missing_panics_doc = "allow"
# Reason: axum extractors hand over std HashMaps; nothing here picks a hasher.
implicit_hasher = "allow"
# Every remaining allow or expect says why.
allow_attributes_without_reason = "warn"
# Reason: handlers return an HTTP response as the error; boxing it buys nothing.
result_large_err = "allow"

# Used by cargo-dist's `dist build` (`cargo build --profile=dist`).
[profile.dist]
inherits = "release"
lto = "thin"
